name: Release

# Tag push (v1.2.3) -> build packs + clients and publish a GitHub Release.
# Manual run       -> same build, bundles kept as workflow artifacts only (nothing published).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packs:
    name: Build theme packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-2 libcairo2 libgdk-pixbuf-2.0-0 fonts-dejavu-core fontconfig
      - name: Build all variants
        run: python3 build.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/
          retention-days: 3

  client:
    name: Client (${{ matrix.os }})
    needs: packs
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bin: ironhold.exe
          - os: ubuntu-latest
            platform: linux
            bin: ironhold
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep -m1 '^version' client/Cargo.toml | cut -d'"' -f2)"
          [ "$want" = "$have" ] || { echo "Tag v$want but client/Cargo.toml says $have"; exit 1; }
      - name: Test
        run: cargo test --manifest-path client/Cargo.toml --release
      - name: Build
        run: cargo build --manifest-path client/Cargo.toml --release
      - uses: actions/download-artifact@v4
        with:
          name: packs
          path: dist
      - name: Assemble bundle
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/* ]] || ver="dev-${GITHUB_SHA::7}"
          name="ironhold-${ver}-${{ matrix.platform }}-x64"
          mkdir -p "bundle/$name/packs"
          cp "client/target/release/${{ matrix.bin }}" "bundle/$name/"
          cp -r "dist/${{ matrix.platform }}" "bundle/$name/packs/"
          cp README.md fonts/OFL-Cinzel.txt "bundle/$name/"
          cat > "bundle/$name/QUICKSTART.txt" <<TXT
          Ironhold ${ver}

            ${{ matrix.bin }} list            show the variants (Crown, Ember, Grave)
            ${{ matrix.bin }} apply crown     switch your desktop to a variant
            ${{ matrix.bin }} art use <image> --recolor
                                         use your own wallpaper and match the colors to it
            ${{ matrix.bin }} restore         go back to your previous look
            ${{ matrix.bin }} uninstall       restore and remove all Ironhold files

          Keep the packs folder next to the program. No admin rights are needed.
          TXT
          echo "BUNDLE=$name" >> "$GITHUB_ENV"
      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "bundle/$env:BUNDLE" -DestinationPath "$env:BUNDLE.zip"
      - name: Archive (Linux)
        if: matrix.platform == 'linux'
        run: |
          chmod +x "bundle/$BUNDLE/ironhold"
          tar -C bundle -czf "$BUNDLE.tar.gz" "$BUNDLE"
      - name: Smoke test the bundled client
        shell: bash
        run: |
          out="$("bundle/$BUNDLE/${{ matrix.bin }}" list)"
          echo "$out"
          for v in Crown Ember Grave; do grep -qx "$v" <<<"$out" || { echo "missing $v"; exit 1; }; done
          "bundle/$BUNDLE/${{ matrix.bin }}" --dry-run apply crown
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: ironhold-*-${{ matrix.platform }}-x64.*
          retention-days: 7

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: client
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum ironhold-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ironhold-* SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Ironhold $GITHUB_REF_NAME" --generate-notes
